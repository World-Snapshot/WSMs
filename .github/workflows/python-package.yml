name: Python package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository and runtime submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lightweight package tooling
        run: python -m pip install --upgrade build pytest twine

      - name: Run task-catalog and CLI tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q src/tests

      - name: Build wheel and source distribution
        run: python -m build

      - name: Validate publication metadata
        run: python -m twine check dist/*

      - name: Smoke-test the built wheel
        run: |
          python -m venv wheel-smoke
          wheel-smoke/bin/python -m pip install --no-deps dist/*.whl
          wheel-smoke/bin/python -c "import importlib.util, wsms; assert importlib.util.find_spec('wsm') is None"
          wheel-smoke/bin/wsms --version
          wheel-smoke/bin/wsms tunnel list --input 0-2 --output 36-38
          wheel-smoke/bin/wsms head list --source sparse --limit 3
